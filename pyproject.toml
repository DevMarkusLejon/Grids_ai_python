[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grids-ai"
version = "0.1.0"
description = "A simplified Python recreation of Grids with a trainable AI."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Codex" }
]

[project.optional-dependencies]
neural = [
  "numpy>=1.26",
  "torch>=2.2",
]
search = [
  "optuna>=3.6",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
grids-ai = "grids_ai.cli:main"
grids-ai-neural = "grids_ai.neural:main"
grids-ai-registry = "grids_ai.model_registry:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["grids_ai*"]
